name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - nexus-foundation-reset
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build and lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0

      - name: Install workspace dependencies
        run: npm install --no-audit --no-fund

      - name: Build all workspaces
        run: npm run build

      - name: Lint frontend
        run: npm run lint --workspace @nexus/front
